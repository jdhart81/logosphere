name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install elan and pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.28.0
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run demo
      - run: node dist/packages/agent-runtime/src/cli.js check artifacts/demo.json
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Generated schemas are current
        run: git diff --exit-code -- schemas/
